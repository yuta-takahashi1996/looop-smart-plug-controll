[project]
name = "looop-smart-plug-controll"
version = "0.1.0"
description = "Looopでんきの料金予報に基づきSwitchBotスマートプラグを自動制御するシステム"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "apscheduler>=3.10,<4",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
