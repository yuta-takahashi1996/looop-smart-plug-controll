<!doctype html>
<html lang="ja" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Looop Smart Plug Controller{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
  <script src="{{ url_for('static', path='js/htmx.min.js') }}" defer></script>
  {% block head %}{% endblock %}
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
  <header class="border-b border-slate-800 bg-slate-900">
    <div class="mx-auto flex max-w-5xl items-center justify-between px-4 py-3">
      <a href="{{ url_for('dashboard') }}" class="text-lg font-semibold">Looop Smart Plug Controller</a>
      {% if dry_run %}
      <span class="rounded-full bg-amber-500/20 px-3 py-1 text-xs font-medium text-amber-300">DRY RUN</span>
      {% endif %}
    </div>
  </header>
  <main class="mx-auto max-w-5xl px-4 py-6">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
