services:
  looop-controller:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: looop-controller

    restart: unless-stopped

    env_file:
      - .env

    environment:
      TZ: Asia/Tokyo
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: sqlite:////app/data/app.db

    ports:
      - "127.0.0.1:8080:8080"

    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

    depends_on:
      - mqtt

    stop_grace_period: 30s

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # FOSSiBOT のポータブル電源が接続する MQTT ブローカー（docs/17-multi-device.md §17.9.4）。
  # アプリからは同じネットワークのサービス名 mqtt で接続する（FOSSIBOT_MQTT_HOST=mqtt）。
  # 機器から届くよう 1883 を LAN に公開する（ルーターでポートを開放しないこと）
  mqtt:
    image: eclipse-mosquitto:2.0.20

    container_name: looop-mqtt

    restart: unless-stopped

    ports:
      - "1883:1883"

    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
