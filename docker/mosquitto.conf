# FOSSiBOT のポータブル電源が接続する MQTT ブローカー（docs/17-multi-device.md §17.9.4）。
# 機器のファームウェアは匿名でしか接続できないため、匿名接続を許可する。
# 1883 は宅内 LAN に公開する（機器から届く必要がある）。ルーターでポートを開放しないこと。
listener 1883 0.0.0.0
allow_anonymous true
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S
